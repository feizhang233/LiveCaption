name: ReplayKitProbe
options:
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    LIVE_CAPTION_APP_GROUP: group.com.example.livecaption.probe
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  LiveCaptionProbe:
    type: application
    platform: iOS
    sources:
      - ProbeHost
      - PiP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.livecaption.probe
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LiveCaptionAppGroup: "$(LIVE_CAPTION_APP_GROUP)"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_ENTITLEMENTS: BroadcastExtension/Probe.entitlements
    dependencies:
      - target: BroadcastProbe
  BroadcastProbe:
    type: app-extension
    platform: iOS
    sources:
      - path: BroadcastExtension
        excludes:
          - Info.plist
          - Probe.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.livecaption.probe.broadcast
        INFOPLIST_FILE: BroadcastExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: BroadcastExtension/Probe.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
schemes:
  LiveCaptionProbe:
    build:
      targets:
        LiveCaptionProbe: all
